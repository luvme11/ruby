/* Layout: one clinical scan stage. Title HUD top-left, heart centered, six glass callouts tethered to nodes (left/right), ECG line crossing the heart, dial arcs bleeding off the left edge. Phone: heart on top, callouts in a 2-col list. */
:root {
  --bg: #e9f0fb;
  --ink: #15294f;
  --blue: #1d4ed8;
  --blue-soft: #8dbbff;
  --mute: #6a7ea2;
  --line: #9db3d6;
  --glass: rgba(255, 255, 255, 0.66);
  --glass-edge: rgba(255, 255, 255, 0.95);
  --shadow: rgba(52, 96, 168, 0.14);
  --font-display: "Pretendard Variable", Pretendard, -apple-system, BlinkMacSystemFont, system-ui, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
  --font-label: "Pretendard Variable", Pretendard, -apple-system, BlinkMacSystemFont, system-ui, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
  --font-data: "Pretendard Variable", Pretendard, -apple-system, BlinkMacSystemFont, system-ui, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
  --beat: 0.822s;
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background-color: var(--bg);
  background-image:
    radial-gradient(circle at 20% 18%, rgba(160, 200, 255, 0.55) 0, transparent 28%),
    radial-gradient(circle at 82% 88%, rgba(150, 195, 255, 0.6) 0, transparent 30%),
    radial-gradient(circle at 50% 70%, rgba(205, 235, 235, 0.55) 0, transparent 35%),
    radial-gradient(circle, rgba(255, 255, 255, 0.9) 1px, transparent 1.4px);
  background-size: auto, auto, auto, 22px 22px;
  background-attachment: fixed;
  color: var(--ink);
  font-family: var(--font-data);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 8px;
  min-height: 100vh;
}
.stage {
  container-type: inline-size;
  position: relative;
  width: min(100%, calc(100svh * 1187 / 820));
  margin-inline: auto;
  aspect-ratio: 1187 / 820;
  min-width: 0;
}
.scan { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
.mono { font-family: var(--font-data); letter-spacing: 0.14em; text-transform: uppercase; }

/* HUD */
.hud { position: absolute; left: 2.6%; top: 3.2%; z-index: 3; }
.eyebrow { font-size: clamp(8px, 0.95cqw, 12px); color: var(--mute); }
.title {
  margin: 0.8cqw 0 0; font-family: var(--font-display); font-weight: 400;
  font-size: clamp(22px, 2.75cqw, 38px); letter-spacing: 0.03em; line-height: 1.15;
  display: flex; align-items: center; gap: 0.7em; text-wrap: balance;
}
.title svg { width: 1.15em; height: 0.6em; flex: none; }
.status { margin-top: 2.2cqw; display: flex; flex-wrap: wrap; gap: 0.5em 1.4em; font-size: clamp(8px, 0.95cqw, 12px); color: var(--mute); }
.status b { color: var(--ink); font-weight: 500; }
.status .rec { color: var(--blue); font-weight: 500; display: inline-flex; align-items: center; gap: 0.6em; }
.status .rec i { width: 0.8em; height: 0.8em; border-radius: 50%; background: #2f7bff; box-shadow: 0 0 0 0.25em rgba(47,123,255,0.2); animation: blink 1.6s steps(2, jump-none) infinite; }
.status .depth { color: var(--blue); }
@keyframes blink { 50% { opacity: 0.25; } }

.mode { position: absolute; right: 4.8%; top: 3.6%; z-index: 5; }
.pill {
  font: inherit; color: var(--ink); cursor: pointer; border: 1px solid var(--glass-edge);
  background: var(--glass); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
  border-radius: 999px; box-shadow: 0 4px 16px var(--shadow);
  font-size: clamp(8px, 0.92cqw, 11px); letter-spacing: 0.16em; text-transform: uppercase;
  padding: 0.9em 1.4em; display: inline-flex; align-items: center; gap: 0.9em;
}
.pill:focus-visible, .card:focus-visible, .menu-btn:focus-visible, .mode-menu button:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }
.pill .dot { width: 0.85em; height: 0.85em; border-radius: 50%; background: #3b8bff; }
.pill .chev { width: 0.9em; height: 0.9em; stroke: currentColor; fill: none; stroke-width: 1.5; transition: transform 0.2s; }
.pill[aria-expanded="true"] .chev { transform: rotate(180deg); }
.mode-menu {
  list-style: none; margin: 0.6em 0 0; padding: 0.4em; position: absolute; right: 0; min-width: 100%;
  background: rgba(255,255,255,0.9); border: 1px solid var(--glass-edge); border-radius: 14px;
  box-shadow: 0 10px 28px var(--shadow);
}
.mode-menu[hidden] { display: none; }
.mode-menu button {
  font: inherit; font-size: clamp(8px, 0.92cqw, 11px); letter-spacing: 0.14em; text-transform: uppercase;
  width: 100%; text-align: left; padding: 0.9em 1.1em; border: 0; background: none; color: var(--ink); border-radius: 10px; cursor: pointer; white-space: nowrap;
}
.mode-menu button:hover, .mode-menu button[aria-checked="true"] { background: rgba(60,120,230,0.12); }
.menu-btn { position: absolute; right: 1.3%; top: 3.4%; z-index: 4; width: 2.2cqw; min-width: 18px; aspect-ratio: 1; border: 0; background: none; color: var(--mute); padding: 0; cursor: pointer; }
.menu-btn svg { width: 100%; height: 100%; stroke: currentColor; stroke-width: 1.4; fill: none; }

/* callouts */
.labels { list-style: none; margin: 0; padding: 0; }
.card {
  position: absolute; z-index: 3; text-align: left; font: inherit; color: var(--ink); cursor: pointer;
  background: var(--glass); border: 1px solid var(--glass-edge); border-radius: 0.95cqw;
  backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  box-shadow: 0 6px 22px var(--shadow);
  padding: 0.85cqw 1.35cqw 0.8cqw; transform: translateY(-50%);
  transition: box-shadow 0.25s, background 0.25s, translate 0.25s;
  display: flex; flex-direction: column; gap: 0.45cqw; min-width: 0;
}
.card .name { font-family: var(--font-label); font-size: clamp(11px, 1.38cqw, 18px); letter-spacing: 0.07em; text-transform: uppercase; line-height: 1.1; white-space: nowrap; }
.card .sub { font-size: clamp(6.5px, 0.7cqw, 9px); letter-spacing: 0.12em; text-transform: uppercase; color: var(--mute); white-space: nowrap; }
.card:hover, .card.on { background: rgba(255,255,255,0.92); box-shadow: 0 8px 28px rgba(40,100,220,0.28); }
.card.on .name { color: var(--blue); }
.card.l { right: calc((1 - 335 / 1187) * 100%); }
.card.r { left: calc(856 / 1187 * 100%); }
.card.l:hover, .card.l.on { translate: 0.4cqw 0; }
.card.r:hover, .card.r.on { translate: -0.4cqw 0; }

/* SVG parts */
.vessel-glow { filter: drop-shadow(0 0 3px rgba(37, 99, 235, 0.65)) drop-shadow(0 0 8px rgba(80, 140, 255, 0.35)); }
.beat { transform-box: fill-box; transform-origin: 48% 62%; }
.throb .beat { animation: lubdub var(--throb, 1.15s) ease-in-out 1; }
.paused .beat, .paused .ecg-live, .paused .halo-pulse { animation-play-state: paused; }
@keyframes lubdub { 0%{transform:scale(1)} 12%{transform:scale(1.032)} 24%{transform:scale(1)} 36%{transform:scale(1.018)} 52%,100%{transform:scale(1)} }
.halo-pulse { transform-box: fill-box; transform-origin: center; }
.throb .halo-pulse { animation: halo var(--throb, 1.15s) ease-out 1; }
@keyframes halo { 0%{opacity:.7; transform:scale(.98)} 40%{opacity:.25; transform:scale(1.04)} 100%{opacity:.7; transform:scale(.98)} }
.ecg-live { stroke-dasharray: 5 95; animation: sweep var(--sweep, 3.8s) linear infinite; }
@keyframes sweep { from { stroke-dashoffset: 5; } to { stroke-dashoffset: -95; } }
.node { cursor: pointer; }
.node circle.core { fill: #fff; stroke: #9bb4dc; stroke-width: 1.2; transition: r 0.2s, stroke 0.2s; }
.node.on circle.core, .node:hover circle.core { stroke: var(--blue); stroke-width: 2; }
.node circle.ring { fill: none; stroke: var(--blue); stroke-width: 1; opacity: 0; transition: opacity 0.2s; }
.node.on circle.ring { opacity: 0.55; }
.leader { stroke: var(--line); stroke-width: 0.9; transition: stroke 0.2s; }
.leader.on { stroke: var(--blue); stroke-width: 1.4; }

/* footer */
.foot { position: absolute; left: 0; right: 0; bottom: 0; z-index: 3; }
.pulse-btn { position: absolute; left: 2.6%; bottom: 3.6%; z-index: 4; color: var(--blue); }
.pulse-btn svg { width: 1em; height: 1em; fill: var(--blue); }
.coords { position: absolute; left: 2.6%; bottom: 1%; font-size: clamp(6.5px, 0.7cqw, 9px); color: var(--mute); letter-spacing: 0.14em; text-transform: uppercase; display: flex; gap: 0.8em; align-items: center; }

.readout { position: absolute; right: 2.6%; bottom: 1%; font-size: clamp(6.5px, 0.7cqw, 9px); color: var(--mute); letter-spacing: 0.14em; text-transform: uppercase; display: flex; gap: 0.7em; align-items: center; }

/* phone */
@media (max-width: 760px) {
  .stage { width: 100%; aspect-ratio: auto; display: flex; flex-direction: column; gap: 14px; container-type: normal; padding-block: 8px 12px; }
  .hud, .mode, .menu-btn, .pulse-btn, .coords, .music, .readout, .foot, .scan, .labels, .card, .ruler { position: static; }
  .hud { order: 1; }
  .title { font-size: 26px; margin-top: 8px; }
  .eyebrow, .status { font-size: 10px; }
  .status { margin-top: 14px; }
  .mode { order: 2; align-self: flex-start; display: flex; flex-direction: column; }
  .mode-menu { position: static; }
  .pill, .mode-menu button { font-size: 10px; }
  .menu-btn { order: 0; align-self: flex-end; width: 22px; height: 22px; }
  .scan { order: 3; aspect-ratio: 580 / 700; height: auto; width: 100%; max-width: 520px; align-self: center; }
  .leaders { display: none; }
  .labels { order: 4; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
  .card { transform: none; padding: 12px 14px; border-radius: 12px; gap: 6px; width: 100%; }
  .card .name { font-size: 12px; white-space: normal; }
  .card .sub { font-size: 8px; white-space: normal; line-height: 1.5; }
  .card.l, .card.r { right: auto; left: auto; }
  .card.l:hover, .card.l.on, .card.r:hover, .card.r.on { translate: none; }
  .pulse-btn { order: 5; align-self: flex-start; font-size: 10px; }
  .coords, .readout { font-size: 8px; flex-wrap: wrap; order: 6; }
  .readout { order: 7; }
  .foot { display: none; }
  .ruler { display: none; }
}
@media (prefers-reduced-motion: reduce) {
  .beat, .ecg-live, .halo-pulse, .status .rec i { animation: none; }
}

.ab { padding: 7px 18px; border-radius: 16px; border: 1px solid #5f84c9; background: linear-gradient(180deg, #8fb0e6, #6a8fd0); color: #fff; font: 700 12px var(--font-display); letter-spacing: 0.06em; cursor: pointer; box-shadow: 0 2px 8px rgba(80,130,220,0.25); }
.ab:disabled { opacity: 0.5; cursor: default; }
.ab.ghost { background: linear-gradient(180deg, #fff, #eaf2ff); color: #3d5a96; border-color: #a9c1e8; box-shadow: none; }
.ab.sm { padding: 4px 12px; font-size: 11px; }
.ad-row { display: grid; grid-template-columns: 1fr 1.6fr auto; gap: 8px; align-items: start; margin-bottom: 8px; }
.ad-card { border: 1px solid #d3e0f4; border-radius: 10px; padding: 14px; margin: 0 0 12px; background: #f6faff; }
.ad-card > h4 { margin: 0 0 10px; font-family: var(--font-data); font-size: 10px; font-weight: 400; letter-spacing: 0.16em; color: #7f9bd4; }
.ap { width: 132px; height: 100px; border: 1px solid #c9d9f2; border-radius: 8px; background: #eef4fd; display: flex; align-items: center; justify-content: center; overflow: hidden; font: 9px var(--font-data); letter-spacing: 0.16em; color: #8aa5d6; margin-bottom: 8px; }
.ap img { width: 100%; height: 100%; object-fit: cover; }
.adf { flex: 0 0 auto; display: flex; align-items: center; gap: 8px; padding: 10px 14px; border-top: 1px solid #d3e0f4; background: linear-gradient(180deg, #f3f8ff, #e9f1fc); }
.adf .st { flex: 1; font: 11px var(--font-data); letter-spacing: 0.04em; color: var(--mute); }
.adm .err { color: #c8687c; }
.adm .okc { color: #4a8f6a; font-size: 12px; margin: 0 0 12px; }
@media (max-width: 640px) {
  .adw { height: 94vh; }
  .adb { grid-template-columns: 1fr; grid-template-rows: auto 1fr; }
  .adn { flex-direction: row; overflow-x: auto; border-right: 0; border-bottom: 1px solid #d3e0f4; padding: 8px; }
  .adn button { width: auto; white-space: nowrap; padding: 7px 12px; }
  .adn .sp { display: none; }
  .adm-main { padding: 16px; }
}
/* music */
.music { position: absolute; left: 2.6%; bottom: 0.4%; z-index: 4; }
.music-btn { display: flex; align-items: flex-end; justify-content: center; width: 38px; height: 32px; padding: 6px 8px; border: 0; background: none; cursor: pointer; opacity: 0.55; transition: opacity .2s; }
.music-btn:hover, .music-btn.on { opacity: 1; }
.music-btn.none { opacity: 0.3; cursor: default; }
.music-btn:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; border-radius: 6px; }
.eq { display: flex; align-items: flex-end; gap: 3px; width: 100%; height: 100%; }
.eq i { flex: 1; background: #5e9bff; border-radius: 1px; height: 3px; }
.music-btn.on .eq i { animation: eq 0.9s ease-in-out infinite; }
.music-btn.on .eq i:nth-child(2) { animation-duration: 0.65s; animation-delay: -0.3s; }
.music-btn.on .eq i:nth-child(3) { animation-duration: 1.1s; animation-delay: -0.6s; }
@keyframes eq { 0%, 100% { height: 25%; } 50% { height: 100%; } }
#ytHost { position: fixed; left: -400px; top: 0; width: 200px; height: 200px; pointer-events: none; border: 0; }
#musicMsg { position: fixed; left: 14px; bottom: 44px; z-index: 90; max-width: min(360px, 86vw); padding: 9px 14px; border-radius: 12px; background: rgba(255,255,255,.96); border: 1px solid #c9d9f2; box-shadow: 0 6px 24px rgba(60,100,200,.22); color: #3d5a96; font: 12px/1.6 var(--font-display); display: none; }
@media (max-width: 760px) { .music { order: 6; align-self: flex-start; } }
@media (prefers-reduced-motion: reduce) { .music-btn.on .eq i { animation: none; height: 60%; } }
.rp p, .rp .ds, .rp-quote, .rp-note, .rp-rx .memo, .rp-ng li span, .rp-chk li span { white-space: pre-wrap; }
/* medicine mini game */
.mg { font-family: var(--font-display); color: var(--ink); }
.mg-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; font-family: var(--font-data); font-size: 10px; letter-spacing: 0.12em; color: var(--mute); text-transform: uppercase; }
.mg-hearts { font-size: 15px; letter-spacing: 0.1em; }
.mg-hearts .on { color: #e58aa0; } .mg-hearts .off { color: #d3e0f4; }
.mg-order { border: 1px solid #d3e0f4; border-radius: 10px; background: #f3f8ff; padding: 12px 14px; margin-bottom: 12px; }
.mg-order b { font-size: 16px; font-weight: 500; }
.mg-order p { margin: 4px 0 10px; font-size: 12px; line-height: 1.6; color: #4a6fb8; }
.mg-chips span { display: inline-block; margin: 0 6px 6px 0; padding: 3px 10px; border-radius: 12px; border: 1px solid #c9d9f2; background: #fff; color: #3d5a96; font-family: var(--font-data); font-size: 11px; }
.mg-chips .ok { border-color: #8fcfae; color: #3f8f67; background: #effaf3; }
.mg-chips .bad { border-color: #e0a3b0; color: #c8687c; background: #fdf0f3; }
.mg-lab { font-family: var(--font-data); font-size: 10px; letter-spacing: 0.2em; color: #7f9bd4; margin: 4px 0 6px; text-transform: uppercase; }
.mg-shelf { display: grid; grid-template-columns: repeat(auto-fill, minmax(112px, 1fr)); gap: 8px; margin-bottom: 12px; }
.mg-ing { font: inherit; text-align: center; align-items: center; display: flex; flex-direction: column; gap: 6px; padding: 12px 8px 10px; border: 1px solid #d3e0f4; border-radius: 10px; background: #fff; color: var(--ink); box-shadow: 0 2px 8px rgba(80,130,220,0.08); transition: box-shadow .2s, transform .2s; }
.mg-ing:hover:not(:disabled) { box-shadow: 0 5px 16px rgba(60,120,230,0.22); transform: translateY(-2px); }
.mg-ing:disabled { opacity: 0.45; }
.mg-ico { width: 58px; height: 58px; border-radius: 50%; display: flex; align-items: center; justify-content: center; background: radial-gradient(circle at 35% 28%, #fff, #e4eefc); border: 1px solid #d3e0f4; }
.mg-ing:hover:not(:disabled) .mg-ico { border-color: #8db3f2; background: radial-gradient(circle at 35% 28%, #fff, #d6e6fb); }
.mg-ing b { font-size: 13px; font-weight: 500; }
.mg-fx { display: flex; flex-wrap: wrap; gap: 3px; justify-content: center; }
.mg-fx em { font-style: normal; font-family: var(--font-data); font-size: 9.5px; letter-spacing: 0.02em; padding: 1px 7px; border-radius: 9px; background: #eef4fd; color: #3d5a96; }
.mg-fx em.bad { background: #fdf0f3; color: #c8687c; }
.mg-fx em.good { background: #effaf3; color: #3f8f67; }
.mg-mi { display: inline-flex; vertical-align: middle; margin-right: 5px; }
.mg-pot { display: grid; grid-template-columns: 200px 1fr; gap: 12px; align-items: center; border: 1px dashed #b4c9ea; border-radius: 10px; padding: 8px 12px; background: #fbfdff; margin-bottom: 12px; }
.mg-pot svg { width: 100%; height: auto; display: block; }
.mg-in { display: flex; flex-wrap: wrap; gap: 6px; min-height: 28px; align-items: center; font-size: 12px; color: var(--mute); }
.mg-in button { font: inherit; font-size: 12px; display: inline-flex; align-items: center; padding: 3px 10px; border-radius: 14px; border: 1px solid #c9d9f2; background: #fff; color: #3d5a96; }
.mg-btns { display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; }
.mg-bar { position: relative; height: 22px; border-radius: 11px; background: #e1ecfb; overflow: hidden; margin: 10px 0 12px; }
.mg-bar .zone { position: absolute; top: 0; bottom: 0; background: rgba(120,200,160,0.55); border-left: 2px solid #6fb892; border-right: 2px solid #6fb892; }
.mg-bar .mk { position: absolute; top: 2px; bottom: 2px; width: 6px; margin-left: -3px; border-radius: 3px; background: #4f86e8; box-shadow: 0 0 8px rgba(79,134,232,0.7); }
.mg-center { text-align: center; padding: 8px 0 4px; }
.mg-center h4 { margin: 8px 0 4px; font-size: 18px; font-weight: 500; }
.mg-center p { margin: 0 0 12px; font-size: 13px; line-height: 1.7; color: #4a6fb8; }
.mg-note { font-family: var(--font-data); font-size: 11px; letter-spacing: 0.08em; color: #3d5a96; text-align: center; min-height: 16px; }
@media (max-width: 520px) { .mg-pot { grid-template-columns: 1fr; } }
/* admin board */
.bd-bar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin: 0 0 14px; }
.bd-tabs { display: flex; flex-wrap: wrap; gap: 6px; flex: 1 1 260px; }
.bd-tab { padding: 5px 12px; border-radius: 14px; border: 1px solid #c9d9f2; background: #fff; color: #3d5a96; font: 12px var(--font-display); }
.bd-tab.on { background: #e4eefc; border-color: #8db3f2; color: var(--blue); }
.bd-tab em { font-style: normal; font-family: var(--font-data); font-size: 10px; margin-left: 5px; color: #8aa5d6; }
.bd-new { display: flex; gap: 6px; align-items: center; }
.adm .bd-new select { width: auto; padding: 6px 10px; }
.bd-row { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 10px 12px; border: 1px solid #d3e0f4; border-radius: 10px; background: #fff; margin-bottom: 8px; }
.bd-badge { font: 10px var(--font-data); letter-spacing: 0.08em; padding: 3px 9px; border-radius: 10px; background: #eaf2ff; color: #4a6fb8; border: 1px solid #c9d9f2; white-space: nowrap; }
.bd-badge.hard { background: #fdeef1; color: #c8687c; border-color: #efc3cc; }
.bd-badge.soft { background: #fff6e4; color: #c08a2c; border-color: #f0d9a8; }
.bd-main { min-width: 0; }
.bd-t { font-size: 13px; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.bd-s { font-size: 11px; color: var(--mute); margin-top: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.bd-act { display: flex; gap: 4px; flex-wrap: wrap; justify-content: flex-end; }
.bd-empty { padding: 26px 10px; text-align: center; font-size: 12px; color: var(--mute); border: 1px dashed #c9d9f2; border-radius: 10px; }
.bd-btns { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 4px; }
@media (max-width: 640px) { .bd-row { grid-template-columns: minmax(0, 1fr); } .bd-act { justify-content: flex-start; } }

      p = p.then(function () { return api('PUT', '/contents/' + encodeURI(S.pending[rel].path), { message: 'admin: upload ' + rel, content: S.pending[rel].b64, branch: S.branch }).then(function () { delete S.pending[rel]; }); });
    });
    var ok = false;
    return p.then(function () {
      function put() { return getSha().then(function (f) {
        var body = { message: 'admin: update content', content: u8b64(JSON.stringify(S.data, null, 2)), branch: S.branch };
        if (f && f.sha) body.sha = f.sha; return api('PUT', '/contents/' + cpath(), body);
      }); }
      return put().catch(function (e) { if (e.status === 409 || e.status === 422) return new Promise(function (r) { setTimeout(r, 800); }).then(put); throw e; });
    }).then(function () { H.apply(clone(S.data)); ok = true; st('저장 완료 · GitHub에 올라갔어요. 사이트에는 1~2분 뒤에 반영돼요'); })
      .catch(function (e) { st('저장 실패: ' + (e.name === 'AbortError' ? 'GitHub 응답이 25초 넘게 없어요. 네트워크를 확인하고 다시 저장해 주세요' : (e.status === 401 || e.status === 403 ? '토큰 권한을 확인해 주세요' : e.message)), true); })
      .then(function () { btn.disabled = !S.data; return ok; });
  }

  function openAdm() { adm.classList.add('open'); adm.setAttribute('aria-hidden', 'false'); refresh(); }
  function closeAdm() { adm.classList.remove('open'); adm.setAttribute('aria-hidden', 'true'); }
  function logout() { S.token = ''; S.data = null; S.pending = {}; S.view = 'gh'; S.bd.edit = null; try { sessionStorage.removeItem('heartTok'); } catch (e) {} g('admToken').value = ''; g('admMsg').textContent = ''; st(''); refresh(); }

  var saved = {}; try { saved = JSON.parse(localStorage.getItem('heartAdm') || '{}'); } catch (e) {}
  var guess = ''; if (/\.github\.io$/.test(location.hostname)) guess = location.hostname.split('.')[0] + '/' + (location.pathname.split('/')[1] || '');
  g('admRepo').value = saved.repo || guess; g('admBranch').value = saved.branch || 'main'; g('admDir').value = saved.dir || '';
  try { var tk = sessionStorage.getItem('heartTok'); if (tk) g('admToken').value = tk; } catch (e) {}

  g('admOpen').addEventListener('click', openAdm);
  g('admGo').addEventListener('click', login);
  g('admToken').addEventListener('keydown', function (e) { if (e.key === 'Enter') login(); });
  g('admSave').addEventListener('click', save);
  g('admOut').addEventListener('click', logout);
  g('admClose2').addEventListener('click', closeAdm);
  adm.addEventListener('mousedown', function (e) { if (e.target === adm) closeAdm(); });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && adm.classList.contains('open')) closeAdm(); });
})();
</script>

<script>
(function () {
  /* 선(ECG)이 심장에 닿는 순간에만 한 번 두근 + 소리가 나요 */
  var stage = document.getElementById('stage'), ctx = null, master = null, VOL = 0.12, lastT = 0;
  function unlock() {
    try {
      if (!ctx) { var AC = window.AudioContext || window.webkitAudioContext; if (!AC) return; ctx = new AC(); master = ctx.createGain(); master.gain.value = VOL; master.connect(ctx.destination); }
      if (ctx.state === 'suspended') ctx.resume();
    } catch (e) {}
  }
  ['pointerdown', 'touchstart', 'keydown'].forEach(function (ev) { window.addEventListener(ev, unlock, { passive: true }); });

  function thump(at, f0, f1, peak, len) {
    var t = ctx.currentTime + at;
    var o1 = ctx.createOscillator(), o2 = ctx.createOscillator(), g = ctx.createGain(), lp = ctx.createBiquadFilter(), g2 = ctx.createGain();
    o1.type = 'sine'; o2.type = 'triangle';
    o1.frequency.setValueAtTime(f0, t); o1.frequency.exponentialRampToValueAtTime(f1, t + len);
    o2.frequency.setValueAtTime(f0 * 2, t); o2.frequency.exponentialRampToValueAtTime(f1 * 2, t + len);
    lp.type = 'lowpass'; lp.frequency.value = 220;
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(peak, t + 0.012); g.gain.exponentialRampToValueAtTime(0.0001, t + len);
    g2.gain.value = 0.35;
    o1.connect(g); o2.connect(g2); g2.connect(g); g.connect(lp); lp.connect(master);
    o1.start(t); o2.start(t); o1.stop(t + len + 0.02); o2.stop(t + len + 0.02);
  }
  function throb() {
    var now = performance.now(); if (now - lastT < 1500) return; lastT = now;      // 중복 방지
    if (stage.classList.contains('paused') || document.hidden) return;
    stage.classList.remove('throb'); void stage.offsetWidth; stage.classList.add('throb'); // 두근 모션
    if (ctx && ctx.state === 'running') { thump(0, 62, 40, 0.9, 0.16); thump(0.26, 72, 46, 0.55, 0.13); } // 쿵-쿵
  }

  // 왼쪽 ECG 선이 한 바퀴 돌아 심장에 닿는 순간 감지
  var leftLine = document.querySelector('.ecg-live');
  document.addEventListener('animationiteration', function (e) { if (e.animationName === 'sweep' && e.target === leftLine) throb(); });
  var prev = 0;
  (function poll() {
    try {
      var an = leftLine && leftLine.getAnimations && leftLine.getAnimations()[0];
      if (an && an.effect) { var d = an.effect.getComputedTiming().duration, ph = (an.currentTime % d) / d; if (ph < prev - 0.5) throb(); prev = ph; }
    } catch (e) {}
    requestAnimationFrame(poll);
  })();
})();
</script>
